{% extends 'base.html' %}
{% block content %}<div class="row justify-content-center mt-lg-5"><div class="col-md-6 col-lg-5">{% if invalid %}<div class="alert alert-danger">Este link é inválido ou expirou. Solicite uma nova troca de senha.</div><a class="btn btn-primary" href="{{url_for('auth.forgot_password')}}">Solicitar novo link</a>{% else %}<div class="card shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-3">Criar nova senha</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="token" value="{{token}}"><label class="form-label">Nova senha</label><input type="password" name="password" class="form-control mb-3" minlength="8" autocomplete="new-password" required><label class="form-label">Confirmar nova senha</label><input type="password" name="password_confirm" class="form-control mb-3" minlength="8" autocomplete="new-password" required><button class="btn btn-primary w-100">Alterar senha</button></form></div></div>{% endif %}</div></div>{% endblock %}
