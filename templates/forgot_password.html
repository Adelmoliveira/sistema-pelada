{% extends 'base.html' %}
{% block content %}<div class="row justify-content-center mt-lg-5"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-2">Esqueci minha senha</h1><p class="text-muted">Informe o e-mail cadastrado no seu perfil de peladeiro.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="form-label" for="email">E-mail</label><input id="email" name="email" type="email" class="form-control mb-3" autocomplete="email" required><button class="btn btn-primary w-100">Enviar link para trocar a senha</button></form><div class="text-center mt-3"><a href="{{url_for('auth.login')}}">Voltar para o login</a></div></div></div></div></div>{% endblock %}
