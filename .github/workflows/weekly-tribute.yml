name: Verificar homenagem agendada

on:
  schedule:
    # Evita o minuto 00, quando o GitHub alerta para maior risco de atrasos.
    - cron: "7 17 * * 3"
      timezone: "America/Sao_Paulo"
    - cron: "7 15 * * 6"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tribute-cron
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acionar verificação da homenagem
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://sistema-pelada-one.vercel.app/cron/weekly-tribute
